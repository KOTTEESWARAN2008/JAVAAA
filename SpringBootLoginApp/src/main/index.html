<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Boot Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#eef2f7;color:#172033}
.card{width:min(92vw,380px);background:white;padding:30px;border-radius:16px;box-shadow:0 12px 35px #14233c1f}
h1{text-align:center;margin-top:0}label{display:block;margin:16px 0 6px;font-weight:bold}
input{width:100%;padding:12px;border:1px solid #cbd3df;border-radius:8px;font-size:16px}
button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:8px;background:#175cd3;color:white;font-size:16px;font-weight:bold;cursor:pointer}
#message{text-align:center;font-weight:bold}.success{color:#16803c}.error{color:#c62828}.hint{text-align:center;color:#667085;font-size:13px}
</style>
</head>
<body>
<main class="card">
<h1>Login</h1>
<form id="loginForm">
<label for="username">Username</label>
<input id="username" type="text" autocomplete="username" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required>
<button type="submit">Log In</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
<p class="hint">Demo username and password: ADMIN</p>
</main>
<script>
document.getElementById('loginForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const message = document.getElementById('message');
  message.textContent = 'Checking...'; message.className = '';
  try {
    const response = await fetch('/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const result = await response.json();
    message.textContent = result.message;
    message.className = result.success ? 'success' : 'error';
  } catch (e) {
    message.textContent = 'Cannot connect to server. Is Spring Boot running?';
    message.className = 'error';
  }
});
</script>
</body>
</html>
